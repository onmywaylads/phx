<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>피닉스 플랫폼 전환 시안</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root{--blue:#3182F6;--blue-strong:#1B64DA;--navy:#191F28;--g500:#6B7684;--g200:#E5E8EB;--g100:#F2F4F6;--r:22px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard Variable','Pretendard',-apple-system,system-ui,'Malgun Gothic',sans-serif;color:var(--navy);
    letter-spacing:-.02em;-webkit-font-smoothing:antialiased;min-height:100vh;
    background:radial-gradient(1000px 500px at 70% -10%,#E9F1FF,transparent 60%),linear-gradient(180deg,#F7FAFF,#EEF3F9);
    display:flex;flex-direction:column;align-items:center;padding:56px 20px 60px}
  a{text-decoration:none;color:inherit}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;margin-bottom:30px}
  .logo .mk{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--blue),#5A9BFF);color:#fff;display:grid;place-items:center;font-weight:800}
  h1{font-size:clamp(28px,5vw,42px);font-weight:800;letter-spacing:-.04em;text-align:center;line-height:1.2}
  .sub{color:var(--g500);font-size:clamp(15px,2.2vw,18px);margin-top:14px;text-align:center;max-width:36ch;font-weight:500}
  .badge{display:inline-block;margin-top:18px;background:#fff;border:1px solid var(--g200);color:var(--g500);font-size:13px;font-weight:700;padding:7px 14px;border-radius:999px}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:44px;width:100%;max-width:940px}
  .card{background:#fff;border:1px solid var(--g100);border-radius:var(--r);overflow:hidden;box-shadow:0 10px 30px rgba(16,24,40,.08);transition:transform .18s cubic-bezier(.22,.61,.36,1),box-shadow .18s}
  .card:hover{transform:translateY(-5px);box-shadow:0 20px 44px rgba(16,24,40,.14)}
  .card .pv{height:170px;display:grid;place-items:center;position:relative;overflow:hidden}
  .pv.web{background:linear-gradient(135deg,#EAF2FF,#DCEAFF)}
  .pv.plat{background:linear-gradient(135deg,#E7F8F0,#D6F0E4)}
  .pv.app{background:linear-gradient(135deg,#EEF1F6,#E2E8F2)}
  .pv svg{width:54px;height:54px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .pv.web svg{color:#3182F6}.pv.plat svg{color:#12B886}.pv.app svg{color:#4E5968}
  .card .tag{display:inline-block;font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:999px;margin-bottom:8px}
  .card .tag.t1{background:#EAF2FF;color:#1B64DA}.card .tag.t2{background:#E7F8F0;color:#0CA678}.card .tag.t3{background:#EEF1F6;color:#4E5968}
  .card .in{padding:22px 22px 24px}
  .card h2{font-size:20px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
  .card p{color:var(--g500);font-size:14.5px;margin-top:7px;font-weight:500;line-height:1.5}
  .card .go{margin-top:16px;display:inline-flex;align-items:center;gap:6px;color:var(--blue-strong);font-weight:800;font-size:15px}
  .foot{margin-top:40px;color:var(--g500);font-size:13.5px;text-align:center;font-weight:500;line-height:1.7;max-width:44ch}
  .foot b{color:var(--navy)}
  @media(max-width:560px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
  <div class="logo">피닉스</div>
  <h1>피닉스 플랫폼 전환 시안</h1>
  <p class="sub">레거시 홈페이지를 벗고, 고객과 대리점을 잇는 요즘 플랫폼으로.</p>
  <span class="badge">가안 · 검토용 v0.2</span>

  <div class="cards">
    <a class="card" href="phoenix-homepage-mockup.html">
      <div class="pv web"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg></div>
      <div class="in">
        <span class="tag t1">① 획득</span>
        <h2>고객 홈페이지</h2>
        <p>검색으로 처음 온 식당이 신뢰하고 결정하는 첫 통로. 가격 공개 · 모델 진단 · 견적.</p>
        <span class="go">시안 열기 →</span>
      </div>
    </a>
    <a class="card" href="phoenix-customer-app-mockup.html">
      <div class="pv plat"><svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg></div>
      <div class="in">
        <span class="tag t2">② 반복</span>
        <h2>고객 플랫폼 앱</h2>
        <p>단골 식당이 세제 재주문 · 구독 · AS를 스스로. 반복 관계를 만드는 통로. (와이즐리형)</p>
        <span class="go">시안 열기 →</span>
      </div>
    </a>
    <a class="card" href="phoenix-daerijeom-mockup.html">
      <div class="pv app"><svg viewBox="0 0 24 24"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg></div>
      <div class="in">
        <span class="tag t3">③ 현장</span>
        <h2>대리점 웹앱</h2>
        <p>오늘 갈 곳 · 부품 재고 O/X · 3탭 발주 · 설치 등록 · 정산. 현장용 모바일 앱.</p>
        <span class="go">시안 열기 →</span>
      </div>
    </a>
  </div>

</body>
</html>
